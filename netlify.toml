# Browser preview of the field app (typed input, or on-device voice once the
# model is present). Tested on mock patients only.
#
# The build fetches the Whisper model so it ships with the site; if the model
# hub is unreachable the build still succeeds (--soft) and voice falls back to
# a one-time download from Settings.

[build]
  base = "."
  command = "npm ci && npm run fetch-model -- --soft && npm run build:field"
  publish = "apps/field/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_PILOT = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "microphone=(self), camera=(self), geolocation=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    # Lets the speech runtime use several CPU threads.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
